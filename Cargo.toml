[package]
name = "podcast-monitor"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.7", features = ["derive"] }
quick-xml = "0.42.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
symphonia = { version = "0.6.1", features = ["mp3", "aac", "isomp4"] }
typst = "0.15.1"
typst-as-lib = "0.17.0"
typst-layout = "0.15.1"
typst-pdf = "0.15.1"
ureq = "3.5.0"
whisper-rs = "0.16.0"

[target.'cfg(windows)'.dependencies]
whisper-rs-sys = { version = "0.15.0", features = ["vulkan"] }

[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16.0", features = ["metal"] }
